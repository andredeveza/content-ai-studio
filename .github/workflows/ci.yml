name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Vercel já faz o deploy real com as env vars de verdade — este build
    # só valida que o projeto compila; os valores abaixo apenas satisfazem
    # o schema do config/env.ts (nenhum é usado para chamar Supabase de
    # verdade em nenhum destes passos).
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: dummy
      SUPABASE_SERVICE_KEY: dummy
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/

      - name: Test
        run: npm test 2>&1 | tee test-output.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Post test output on failure (debug, temporary)
        if: failure()
        shell: bash
        run: |
          BODY=$(tail -c 60000 test-output.log | python3 -c "import json,sys;print(json.dumps(sys.stdin.read()))")
          curl -s -w "\nHTTP:%{http_code}\n" -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "{\"body\": $BODY}"

      - name: Build
        run: npm run build
